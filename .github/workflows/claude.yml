# Lets maintainers hand work to Claude Code on issues and pull requests:
# - add the `claude` label to an issue to start a run on it, or
# - mention @claude in a comment, review, or a new issue's title or body.
# Based on anthropics/claude-code-action's examples/claude.yml; the label
# trigger is the action's `label_trigger` input (docs/usage.md in that repo).
#
# Setup: add an ANTHROPIC_API_KEY repository secret (Settings > Secrets and
# variables > Actions) and install the Claude GitHub App on this repository
# (https://github.com/apps/claude).
#
# This repository is public, so the `if:` below also requires the commenter
# to be an OWNER, MEMBER or COLLABORATOR: anyone else's @claude mention is
# ignored and cannot spend the API key. The label needs no such check:
# only people with triage access or more can label issues.
#
# Claude is not a GitHub user, so issues can't be assigned to it; use the label.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
